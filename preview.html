<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes" name="viewport"/>
<title>土売場検索</title>
<style>

:root{
  --bg:#f2f6f1;--card:#fff;--text:#1d2a22;--muted:#647168;--line:#34453a;
  --accent:#1d6b45;--accent-dark:#124a2f;--accent-soft:#e2f3e9;--gold:#d5a72f;
  --shadow:0 8px 24px rgba(35,62,45,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  color:var(--text);background:radial-gradient(circle at 100% 0,rgba(177,211,187,.32),transparent 34rem),var(--bg)
}
header{position:sticky;top:0;z-index:50;color:#fff;background:linear-gradient(135deg,var(--accent-dark),var(--accent));box-shadow:0 4px 18px rgba(18,74,47,.22)}
.head{max-width:1380px;margin:auto;padding:14px 16px}
h1{font-size:1.28rem;margin:0 0 10px;letter-spacing:.02em} h1::before{content:"🌿";margin-right:.45rem}
.search-row{display:flex;gap:8px;align-items:center;padding:7px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:15px}
input[type=search]{flex:1;min-width:0;padding:12px 14px;font-size:16px;color:var(--text);border:0;border-radius:10px;background:#fff;outline:0}
input[type=search]:focus{box-shadow:0 0 0 3px rgba(255,225,133,.88)}
button{border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;background:#fff;color:var(--accent-dark);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.16)} button:active{transform:translateY(0)}
button.secondary{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.36)}
.status{font-size:.88rem;color:rgba(255,255,255,.84);margin-top:7px;min-height:1.3em}
main{max-width:1380px;margin:auto;padding:20px 14px 48px}
.legend{background:#fff;border:1px solid #d7e2da;border-left:5px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.9rem;box-shadow:var(--shadow)}
 .mobile-hint{display:none}
.results{display:none;background:#fff;border:2px solid var(--accent);border-radius:14px;padding:12px 14px;margin:0 0 16px;box-shadow:var(--shadow)}
.results.show{display:block} .results h2{font-size:1rem;color:var(--accent);margin:0 0 8px}
.result-list{display:flex;flex-wrap:wrap;gap:7px}
.result-chip{border:1px solid #c9d8ce;background:#f8fbf9;border-radius:999px;padding:7px 10px;font-size:.82rem;color:var(--text);cursor:pointer;max-width:100%;white-space:normal;text-align:left}
.result-chip:hover{background:var(--accent-soft)}
.floor-card{background:rgba(255,255,255,.82);border:1px solid #d9e4dc;border-radius:14px;box-shadow:var(--shadow);padding:10px;overflow:hidden}
.floor-scroll{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:10px;background:#edf3ef;padding:10px}
.map-sizer{position:relative;margin:0 auto}
.layout{position:absolute;left:0;top:0;width:2120.00px;height:1890.00px;background:#fff;transform-origin:top left;border:2px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:0 3px 10px rgba(31,35,40,.08)}
.item{position:absolute;box-sizing:border-box;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;line-height:1.18;padding:5px 7px;overflow:hidden;overflow-wrap:anywhere;word-break:normal;background:#fff;transition:background .16s ease,box-shadow .16s ease}
.item:hover{background:#f1f8f3} .item.blank{background:#fbfcfb}
.item div{max-width:100%;white-space:normal}
.label{position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;white-space:nowrap;font-weight:800;color:var(--accent-dark);writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.08em}
.match{z-index:3;outline:8px solid #f0b928;outline-offset:-8px;background:#fff6cf!important;animation:blink .7s ease-in-out 5}
@keyframes blink{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,238,90,0)}50%{box-shadow:inset 0 0 0 999px rgba(255,238,90,.48)}}
@media (prefers-reduced-motion:reduce){.match{animation:none}}
.no-result{color:#8b342a;font-weight:700}
@media (max-width:720px){
  .head{padding:10px} h1{font-size:1.05rem;margin-bottom:8px}
  .search-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
  input[type=search]{grid-column:1/-1;width:100%;padding:11px 12px} button{min-height:44px;padding:10px 12px}
  .status{font-size:.8rem;margin-top:6px} main{padding:12px 8px 36px}
  .legend{padding:10px;margin-bottom:10px;font-size:.82rem;line-height:1.5} .mobile-hint{display:block;margin-top:4px;color:var(--accent);font-weight:700}
  .floor-card{padding:6px} .floor-scroll{padding:6px;overflow:visible}
  .result-chip{font-size:.75rem}
}

.item.multi-cell{
  padding:0;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:stretch;
}
.item.multi-cell .multi-product{
  flex:1 1 0;
  min-height:0;
  width:100%;
  box-sizing:border-box;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  line-height:1.12;
  padding:4px 6px;
}
.item.multi-cell .multi-product{
  position:relative;
}
.item.multi-cell .multi-product + .multi-product{
  border-top:none;
}
.item.multi-cell .multi-product + .multi-product::before{
  content:"";
  position:absolute;
  top:0;
  left:7px;
  right:7px;
  border-top:2px solid #c9c9c9;
}

<button aria-pressed="false" class="secondary" id="flipBtn" type="button">反転</button></div>

(() => {
  "use strict";

  const BASE_W = 2120;
  const BASE_H = 1890;

  // 商品入れ替えだけなら、ここは編集不要です。
  const LAYOUT = {
    cellWidth: 210,
    cellHeight: 125,
    mainX: 70,
    blockYs: [20, 340, 660, 980, 1300, 1620],

    labelX: 42,
    labelWidth: 24.62,
    labelHeight: 70.15,

    upperIslandX: 1670,
    upperIslandY: 785,

    turfIslandX: 1670,
    turfIslandY: 980
  };

  const data = window.SOIL_DATA;

  const q = document.getElementById("q");
  const searchBtn = document.getElementById("searchBtn");
  const clearBtn = document.getElementById("clearBtn");
  const flipBtn = document.getElementById("flipBtn");
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  const resultTitle = document.getElementById("resultTitle");
  const resultList = document.getElementById("resultList");
  const floorScroll = document.getElementById("floorScroll");
  const mapSizer = document.getElementById("mapSizer");
  const layout = document.getElementById("layout");

  let items = [];
  let targets = [];
  let currentScale = 1;
  let flipped = false;

  const normalize = (s) => String(s || "")
    .normalize("NFKC")
    .toLowerCase()
    .replace(/[\s・･,，。．/／()（）\[\]【】「」『』＋+\-－_%％]/g, "");

  function parseCell(cell) {
    if (cell === null) {
      return { skip: true };
    }

    if (cell === "") {
      return { items: [], rowSpan: 1 };
    }

    if (typeof cell === "string") {
      return { items: [cell], rowSpan: 1 };
    }

    if (Array.isArray(cell)) {
      return { items: cell, rowSpan: 1 };
    }

    if (cell && typeof cell === "object" && Array.isArray(cell.items)) {
      return {
        items: cell.items,
        rowSpan: Number(cell.rowSpan) || 1
      };
    }

    return { items: [], rowSpan: 1 };
  }

  function saveNormalBox(el, left, top, width, height) {
    el.dataset.normalLeft = String(left);
    el.dataset.normalTop = String(top);
    el.dataset.boxWidth = String(width);
    el.dataset.boxHeight = String(height);
  }

  function createItem(cell, left, top) {
    const parsed = parseCell(cell);
    if (parsed.skip) return;

    const width = LAYOUT.cellWidth;
    const height = LAYOUT.cellHeight * parsed.rowSpan;

    const el = document.createElement("div");
    el.className = "item";
    el.style.left = left.toFixed(2) + "px";
    el.style.top = top.toFixed(2) + "px";
    el.style.width = width.toFixed(2) + "px";
    el.style.height = height.toFixed(2) + "px";
    el.style.fontSize = "18px";

    saveNormalBox(el, left, top, width, height);

    if (parsed.items.length === 0) {
      el.classList.add("blank");
      layout.appendChild(el);
      return;
    }

    el.dataset.label = parsed.items.join(" / ");
    el.dataset.search = normalize(parsed.items.join(" "));

    if (parsed.items.length > 1) {
      el.classList.add("multi-cell");

      parsed.items.forEach(name => {
        const line = document.createElement("div");
        line.className = "multi-product";
        line.textContent = name;
        el.appendChild(line);
      });
    } else {
      const line = document.createElement("div");
      line.textContent = parsed.items[0];
      el.appendChild(line);
    }

    layout.appendChild(el);
  }

  function createLabel(text, top) {
    if (!text) return;

    const left = LAYOUT.labelX;
    const width = LAYOUT.labelWidth;
    const height = LAYOUT.labelHeight;
    const y = top + (LAYOUT.cellHeight - height) / 2;

    const el = document.createElement("div");
    el.className = "label";
    el.textContent = text;
    el.style.left = left.toFixed(2) + "px";
    el.style.top = y.toFixed(2) + "px";
    el.style.width = width.toFixed(2) + "px";
    el.style.height = height.toFixed(2) + "px";
    el.style.fontSize = "16px";

    saveNormalBox(el, left, y, width, height);
    layout.appendChild(el);
  }

  function renderMainBlocks() {
    data.mainBlocks.forEach((block, blockIndex) => {
      const blockTop = LAYOUT.blockYs[blockIndex];

      for (let rowIndex = 0; rowIndex < 2; rowIndex++) {
        const rowTop = blockTop + rowIndex * LAYOUT.cellHeight;
        createLabel(block.labels?.[rowIndex] || "", rowTop);

        const row = block.rows?.[rowIndex] || [];

        for (let colIndex = 0; colIndex < 7; colIndex++) {
          createItem(
            colIndex < row.length ? row[colIndex] : "",
            LAYOUT.mainX + colIndex * LAYOUT.cellWidth,
            rowTop
          );
        }
      }
    });
  }

  function renderGrid(rows, startX, startY) {
    rows.forEach((row, rowIndex) => {
      row.forEach((cell, colIndex) => {
        createItem(
          cell,
          startX + colIndex * LAYOUT.cellWidth,
          startY + rowIndex * LAYOUT.cellHeight
        );
      });
    });
  }

  function renderLayout() {
    layout.replaceChildren();

    renderMainBlocks();

    renderGrid(
      data.side.upperIsland || [],
      LAYOUT.upperIslandX,
      LAYOUT.upperIslandY
    );

    renderGrid(
      data.side.turfIsland || [],
      LAYOUT.turfIslandX,
      LAYOUT.turfIslandY
    );

    items = [...layout.querySelectorAll(".item")];
    targets = [...layout.querySelectorAll(".item, .label")];
  }

  function fitText() {
    items.forEach(el => {
      if (el.classList.contains("blank")) return;

      let size = 18;
      el.style.fontSize = size + "px";

      while (
        size > 7 &&
        (el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth)
      ) {
        size -= 1;
        el.style.fontSize = size + "px";
      }
    });
  }

  function fitMap() {
    const mobile = window.matchMedia("(max-width:720px)").matches;
    const available = Math.max(
      280,
      floorScroll.clientWidth - (mobile ? 12 : 20)
    );

    currentScale = Math.min(1, available / BASE_W);

    layout.style.transform = `scale(${currentScale})`;
    mapSizer.style.width = (BASE_W * currentScale) + "px";
    mapSizer.style.height = (BASE_H * currentScale) + "px";
  }

  function clearMatches() {
    items.forEach(el => el.classList.remove("match"));
    results.classList.remove("show");
    resultList.replaceChildren();
  }

  function jumpTo(el) {
    const cardTop =
      document.querySelector(".floor-card").getBoundingClientRect().top +
      window.scrollY;

    const top = parseFloat(el.style.top || 0) * currentScale;

    window.scrollTo({
      top: Math.max(0, cardTop + top - 160),
      behavior: "smooth"
    });

    el.classList.remove("match");
    void el.offsetWidth;
    el.classList.add("match");
  }

  function runSearch() {
    clearMatches();

    const raw = q.value.trim();
    const terms = raw.split(/\s+/).map(normalize).filter(Boolean);

    if (!terms.length) {
      status.textContent =
        "商品名を入力すると該当する場所が点滅します。";
      return;
    }

    const matches = items.filter(el => {
      if (el.classList.contains("blank")) return false;

      const hay = el.dataset.search || "";
      return terms.every(term => hay.includes(term));
    });

    matches.forEach(el => el.classList.add("match"));

    if (!matches.length) {
      status.innerHTML =
        '<span class="no-result">「' +
        escapeHtml(raw) +
        '」に一致する商品は見つかりませんでした。</span>';
      return;
    }

    status.textContent =
      `「${raw}」：${matches.length}か所見つかりました。`;

    resultTitle.textContent =
      `該当する場所 ${matches.length}件`;

    matches.forEach((el, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "result-chip";
      button.textContent =
        `${index + 1}. ${el.dataset.label || "該当場所"}`;
      button.addEventListener("click", () => jumpTo(el));
      resultList.appendChild(button);
    });

    results.classList.add("show");

    setTimeout(() => jumpTo(matches[0]), 80);
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function applyOrientation() {
    targets.forEach(el => {
      const normalLeft = Number(el.dataset.normalLeft);
      const normalTop = Number(el.dataset.normalTop);
      const width = Number(el.dataset.boxWidth);
      const height = Number(el.dataset.boxHeight);

      if (
        !Number.isFinite(normalLeft) ||
        !Number.isFinite(normalTop) ||
        !Number.isFinite(width) ||
        !Number.isFinite(height)
      ) return;

      if (flipped) {
        el.style.left =
          (BASE_W - normalLeft - width).toFixed(2) + "px";
        el.style.top =
          (BASE_H - normalTop - height).toFixed(2) + "px";
      } else {
        el.style.left = normalLeft.toFixed(2) + "px";
        el.style.top = normalTop.toFixed(2) + "px";
      }
    });

    // ボタン名は常に「反転」
    flipBtn.textContent = "反転";
    flipBtn.setAttribute(
      "aria-pressed",
      flipped ? "true" : "false"
    );
  }

  searchBtn.addEventListener("click", runSearch);

  q.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      runSearch();
    }
  });

  clearBtn.addEventListener("click", () => {
    q.value = "";
    clearMatches();
    status.textContent =
      "商品名を入力すると該当する場所が点滅します。";
    q.focus();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  flipBtn.addEventListener("click", () => {
    flipped = !flipped;
    applyOrientation();
  });

  window.addEventListener("resize", fitMap, { passive: true });

  renderLayout();
  fitText();
  fitMap();
  applyOrientation();
})();

</script></body>
</html>
